
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoScout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
      @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
      
      /* Animação de pulo do marcador */
      @keyframes marker-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        30% { transform: translateY(-15px) scale(1.1); }
        50% { transform: translateY(0) scale(1.05); }
        70% { transform: translateY(-5px) scale(1); }
      }
      .animate-marker-bounce { animation: marker-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

      /* Animações da Antena Splash */
      @keyframes antenna-sway {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(8deg); }
      }
      @keyframes ping-slow {
        0% { transform: translate(-50%, 0) scale(0.5); opacity: 0.8; }
        100% { transform: translate(-50%, -20%) scale(2.5); opacity: 0; }
      }
      @keyframes float-particle-1 {
        0%, 100% { transform: translate(0, 0); opacity: 0.5; }
        50% { transform: translate(15px, -25px); opacity: 1; }
      }
      @keyframes float-particle-2 {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(-20px, -15px); opacity: 0.8; }
      }
      @keyframes float-particle-3 {
        0%, 100% { transform: translate(0, 0); opacity: 0.4; }
        50% { transform: translate(10px, 20px); opacity: 0.9; }
      }

      .animate-spin-slow { animation: spin-slow 12s linear infinite; }
      .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
      .animate-antenna-sway { animation: antenna-sway 3s ease-in-out infinite; transform-origin: bottom center; }
      .animate-ping-slow { animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .animate-float-particle-1 { animation: float-particle-1 4s ease-in-out infinite; }
      .animate-float-particle-2 { animation: float-particle-2 5s ease-in-out infinite; }
      .animate-float-particle-3 { animation: float-particle-3 6s ease-in-out infinite; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
      
      html, body, #root { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
      .leaflet-container { background: #000 !important; width: 100%; height: 100%; z-index: 0; }
      .scan-line { animation: scan 2s linear infinite; background: linear-gradient(to bottom, transparent, #06b6d4, transparent); }
      .leaflet-control-container .leaflet-routing-container-hide { display: none; }

      /* Custom Leaflet Popup Styles */
      .leaflet-popup-content-wrapper {
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .leaflet-popup-content {
        margin: 0 !important;
      }
      .leaflet-popup-tip-container {
        display: none !important;
      }
      .leaflet-popup-close-button {
        color: #06b6d4 !important;
        font-size: 16px !important;
        top: 8px !important;
        right: 8px !important;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@1.41.0",
    "leaflet": "https://esm.sh/leaflet@1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@4.2.1?deps=react@18.2.0,react-dom@18.2.0,leaflet@1.9.4",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
